<!DOCTYPE html>
<html>
<head>
  <title>Even or Odd Checker</title>
   <style>
    body {
      background-color: #e0ad35d5; 
      font-family: Serif, sans-serif;
    }
    p {
      color: #3c6fceca;
      font-size: 16px;
      line-height: 1.6;
    }
    input{
          border: 2px solid rgb(0, 0, 0);
          color: #110f0f;
          background: #7b7a7a;
          text-align: center;
          padding: 20px;
         margin-top: 20px;
         border-radius:15px ;
}
    
  </style>

  
</head>
<body>
<center><p><h1 colo>Check if a Number is Even or Odd</h1></p>
  
  <input type="number" id="numberInput" placeholder="Enter a number">
  <button onclick="checkEvenOdd()">Check</button>
  
 <h4><p id="result"></p>
</h4></center>
  

  <script>
    function checkEvenOdd() {
      const num = document.getElementById('numberInput').value; // get value from input
      const number = parseInt(num); // convert to integer

      if (isNaN(number)) {
        document.getElementById('result').innerText = "Please enter a valid number.";
      } else {
        if (number % 2 === 0) {
          document.getElementById('result').innerText = number + " is Even.";
        } else {
          document.getElementById('result').innerText = number + " is Odd.";
        }
      }
    }
  </script>

</body>
</html>
