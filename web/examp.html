

<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Demonstration</title>

 
  <style>
    body {
      background-color: #83f1adb6; 
      font-family: Serif, sans-serif;
    }
    p {
      color: #281faaa7;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>

  
  <link rel="stylesheet" href="out.css">
</head>
<body>
  <marquee direction="right" behavior="alternate" scrollamount="10"loop=50">
  <h2>This text scrolls up, slides in, at moderate speed</h2>
</marquee>

  <h1 style="color: rgb(210, 87, 26);">This is a Heading with Inline CSS</h1>

  <p>This paragraph is styled using <b>internal CSS</b>.</p>
  <p>Another paragraph showing the effect of internal CSS.</p>

  <div class="box">
    This div is styled using <b>external CSS</b>.
  </div>
</body>
</html>
