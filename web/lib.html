  <title>Library Management System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .book-card {
      background: white;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      text-align: left;
    }
    .book-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 12px;
    }
    .book-title {
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 6px;
    }
    .book-author {
      color: #b3501f;
      margin-bottom: 8px;
    }
    
    .book-availability.available {
  color: green;
}

.book-availability.not-available {
  color: red;
}
.book-card {
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.book-card:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 16px rgba(195, 53, 53, 0.2);
}


  </style>
