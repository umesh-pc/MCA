<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery</title>
    <style>
        body{
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container{
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        input,
        select {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;

        }
        button {
           margin-top: 10px;
           background-color: #3498db;
           color: white;
           border: none;
           padding: 12px 20px;
           cursor: pointer;
           border-radius: 5px;
           font-size: 16px;
    }
    </style>
</head>
<body>
    <div class="container">
        <h2>Art Gallery Management System</h2>
        <form >
            <label for="name">Name of work:</label>
            <input type="text" id="name" required>

            <label for="date">Created Date:</label>
            <input type="date" id="date" required>

            <label>Type of Art</label><br><br>
            <input type="checkbox" name="type of art" >
            <label for="name">Craft</label>

            <input type="checkbox" name="type of art" >
            <label for="name">Drawing</label>

            <input type="checkbox" name="type of art" >
            <label for="name">Colouring</label>

            <input type="checkbox" name="type of art" >
            <label for="name">Designing</label><br><br>

            <button type="submit">Submit</button>


        </form>
        
    </div>

    <script>
            alert("Successfull!!!")
    </script>
    
</body>
</html>
